# 生产环境配置（profile: prod）
#
# 原则：本文件不提供任何默认密钥或默认连接串，缺失即启动失败（fail fast）。
# 所有值必须由部署环境注入（docker-compose / 系统环境变量 / 密钥管理服务）。
# 本地开发请使用 application-local.yml（profile: local），禁止在生产激活 local。

spring:
  datasource:
    # 无默认值：缺失时 Spring 启动失败，避免误连到 localhost
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

app:
  auth:
    # 生产默认要求 Secure Cookie；临时 HTTP 部署需显式设为 false（docs/09 §9）
    cookie-secure: ${COOKIE_SECURE:true}
  cors:
    # 必须显式配置正式域名，禁止 *（docs/07 §6）
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    # 无默认值：缺失或长度不足 32 字节时 JwtService 拒绝启动
    secret: ${JWT_SECRET}
  ai:
    # 无默认值：缺失时 ApiKeyCipher 拒绝启动（require-secrets=true），不允许明文落库
    api-key-secret: ${AI_API_KEY_SECRET}
  security:
    # 生产强制要求密钥齐备；local/test 为 false
    require-secrets: true

logging:
  level:
    root: INFO
    com.isles: INFO
