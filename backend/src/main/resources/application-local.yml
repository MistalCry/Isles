# 本机开发环境配置（profile: local）
# 所有真实凭据均从环境变量读取；这里只提供可安全公开的开发默认值。
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/my_social_channel?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    # 仅用于本机开发，长度 >= 32 字节（HS256 要求），禁止用于任何非本地环境
    secret: ${JWT_SECRET:isles-local-dev-secret-0123456789abcdef0123456789abcdef}
  auth:
    cookie-secure: ${COOKIE_SECURE:false}

logging:
  level:
    com.isles: DEBUG
