components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, description: ULID }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 未登录或令牌失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BusinessRule:
      description: 业务规则不满足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: 触发限流
      headers:
        Retry-After:
          schema: { type: integer }
          description: 建议等待秒数
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: CHANNEL_NOT_FOUND }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
            requestId: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        nickname: { type: string }
        avatarUrl: { type: [string, 'null'] }
        signature: { type: [string, 'null'] }
        gender: { type: string, enum: [MALE, FEMALE, UNKNOWN] }
        region: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    UserCard:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            channelId: { type: [string, 'null'] }
            joinedAt: { type: [string, 'null'], format: date-time }
            roleName: { type: [string, 'null'] }
            memberStatus: { type: [string, 'null'] }
    Channel:
      type: object
      properties:
        id: { type: string }
        channelNo: { type: integer }
        name: { type: string }
        avatarUrl: { type: [string, 'null'] }
        coverUrl: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        type: { type: string, enum: [PUBLIC, PRIVATE] }
        visibility: { type: string, enum: [PUBLIC_VISIBLE, MEMBERS_ONLY] }
        ownerId: { type: string }
        memberCount: { type: integer }
        postCount: { type: integer }
        joined: { type: boolean }
        myRoleName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Board:
      type: object
      properties:
        id: { type: string }
        channelId: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        sort: { type: integer }
        postCount: { type: integer }
        createdAt: { type: string, format: date-time }
    MediaItem:
      type: object
      properties:
        type: { type: string, enum: [IMAGE, VIDEO] }
        url: { type: string }
        thumbUrl: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        durationMs: { type: [integer, 'null'] }
    CreatePostRequest:
      type: object
      required: [boardId, content]
      properties:
        boardId: { type: string }
        title: { type: [string, 'null'], maxLength: 200 }
        content: { type: string }
        contentFormat: { type: string, enum: [PLAIN, HTML], default: PLAIN }
        coverUrl: { type: [string, 'null'] }
        media:
          type: array
          maxItems: 9
          items: { $ref: '#/components/schemas/MediaItem' }
    Post:
      type: object
      properties:
        id: { type: string }
        channelId: { type: string }
        channelName: { type: string }
        channelAvatarUrl: { type: [string, 'null'] }
        boardId: { type: string }
        boardName: { type: string }
        authorId: { type: string }
        authorNickname: { type: string }
        authorAvatarUrl: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        content: { type: string }
        contentFormat: { type: string, enum: [PLAIN, HTML] }
        coverUrl: { type: [string, 'null'] }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaItem' }
        viewCount: { type: integer }
        likeCount: { type: integer }
        commentCount: { type: integer }
        shareCount: { type: integer }
        liked: { type: boolean }
        pinned: { type: boolean }
        essence: { type: boolean }
        status: { type: string, enum: [PUBLISHED, DELETED, HIDDEN] }
        createdAt: { type: string, format: date-time }
    PostPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Post' }
        nextCursor: { type: [string, 'null'] }
    PostOffsetPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Post' }
        total: { type: integer }
    Comment:
      type: object
      properties:
        id: { type: string }
        postId: { type: string }
        parentId: { type: [string, 'null'] }
        authorId: { type: string }
        authorNickname: { type: string }
        authorAvatarUrl: { type: [string, 'null'] }
        replyToUserId: { type: [string, 'null'] }
        replyToNickname: { type: [string, 'null'] }
        content: { type: string }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaItem' }
        emoji:
          type: array
          items: { type: string }
        likeCount: { type: integer }
        liked: { type: boolean }
        createdAt: { type: string, format: date-time }
        replies:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
    CommentPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        nextCursor: { type: [string, 'null'] }
    LikeState:
      type: object
      properties:
        liked: { type: boolean }
        likeCount: { type: integer }
    SearchItem:
      type: object
      properties:
        type: { type: string, enum: [CHANNEL, POST] }
