openapi: 3.1.0
info:
  title: 群岛（Isles）API
  version: 0.4.0
  description: |
    社交频道平台后端接口契约（与 `docs/05-API设计.md` 同步维护）。

    - Base URL：`/api/v1`
    - 认证：`Authorization: Bearer <accessToken>`；refresh token 走 HttpOnly Cookie
    - 错误信封：`{ "error": { code, message, details, requestId } }`
    - 列表分页：内容流用游标 `cursor` + `nextCursor`；管理端列表用 `page`/`size` + `total`
    - 限流：超限返回 429 并携带 `Retry-After`
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本地开发
tags:
  - name: auth
    description: 认证与会话
  - name: user
    description: 用户与资料
  - name: channel
    description: 频道、板块、邀请
  - name: post
    description: 帖子与互动
  - name: comment
    description: 评论
  - name: feed
    description: 动态、热门、推荐
  - name: search
    description: 搜索
  - name: dm
    description: 私信
  - name: friend
    description: 好友与拉黑
  - name: notification
    description: 通知
  - name: manage
    description: 频道管理中心
  - name: stats
    description: 数据中心
  - name: ai
    description: 频道问问与频道助手
  - name: admin
    description: 平台管理后台
  - name: media
    description: 媒体上传
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: 注册（每 IP 5 次/小时）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 20 }
                password: { type: string, minLength: 8, maxLength: 64 }
                nickname: { type: string, maxLength: 32 }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [auth]
      summary: 登录（每 IP 10 次/分钟）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功，refresh token 通过 Set-Cookie 下发
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer, example: 900 }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 access token（读取 refresh_token Cookie，轮换旧令牌）
      security: []
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 登出并撤销 refresh token
      responses:
        '204': { description: 已登出 }
  /auth/me:
    get:
      tags: [auth]
      summary: 当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/{id}:
    get:
      tags: [user]
      summary: 用户公开资料
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/card:
    get:
      tags: [user]
      summary: 用户卡片（可带频道上下文返回加入时间/身份组）
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: channelId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 用户卡片
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCard' }
  /users/me:
    patch:
      tags: [user]
      summary: 修改我的资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 32 }
                avatarUrl: { type: [string, 'null'], maxLength: 500 }
                signature: { type: [string, 'null'], maxLength: 200 }
                gender: { type: string, enum: [MALE, FEMALE, UNKNOWN] }
                region: { type: [string, 'null'], maxLength: 64 }
      responses:
        '200':
          description: 更新后的资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /channels:
    post:
      tags: [channel]
      summary: 创建频道（自动生成频道号、默认板块与四个系统身份组）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, avatarUrl]
              properties:
                name: { type: string, maxLength: 64 }
                avatarUrl: { type: string, maxLength: 500 }
                coverUrl: { type: [string, 'null'], maxLength: 500 }
                description: { type: [string, 'null'], maxLength: 1000 }
                type: { type: string, enum: [PUBLIC, PRIVATE] }
                visibility: { type: string, enum: [PUBLIC_VISIBLE, MEMBERS_ONLY] }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
  /channels/mine:
    get:
      tags: [channel]
      summary: 我加入的频道
      responses:
        '200':
          description: 频道列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Channel' }
  /channels/{id}:
    get:
      tags: [channel]
      summary: 频道详情（按可见性校验）
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 频道详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '404': { $ref: '#/components/responses/NotFound' }
  /channels/{id}/join:
    post:
      tags: [channel]
      summary: 加入公开频道
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 加入成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '409': { $ref: '#/components/responses/Conflict' }
  /channels/{id}/boards:
    get:
      tags: [channel]
      summary: 频道板块列表
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 板块列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Board' }
                  nextCursor: { type: [string, 'null'] }
  /channels/{id}/posts:
    get:
      tags: [post]
      summary: 频道帖子列表（latest/hot/essence，可按板块过滤）
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: tab
          in: query
          schema: { type: string, enum: [latest, hot, essence], default: latest }
        - name: boardId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 帖子分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
    post:
      tags: [post]
      summary: 发帖（每用户 10 次/分钟）
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /posts/{id}:
    get:
      tags: [post]
      summary: 帖子详情（浏览量 +1）
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 帖子详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [post]
      summary: 删除帖子（作者或具备 post.delete 的管理者）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 已删除 }
  /posts/{id}/like:
    post:
      tags: [post]
      summary: 点赞帖子
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 点赞状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
    delete:
      tags: [post]
      summary: 取消点赞
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 点赞状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
  /posts/{id}/share:
    post:
      tags: [post]
      summary: 分享计数
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 分享后计数
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareCount: { type: integer }
  /posts/{postId}/comments:
    get:
      tags: [comment]
      summary: 评论列表（likes/latest 排序）
      security: []
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [latest, likes], default: latest }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 评论分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
    post:
      tags: [comment]
      summary: 发表评论/回复（每用户 30 次/分钟）
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 2000 }
                parentId: { type: [string, 'null'] }
                replyToUserId: { type: [string, 'null'] }
                media: { type: array, items: { $ref: '#/components/schemas/MediaItem' } }
                emoji: { type: array, items: { type: string } }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /comments/{id}/like:
    post:
      tags: [comment]
      summary: 点赞评论
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 点赞状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
    delete:
      tags: [comment]
      summary: 取消点赞评论
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 点赞状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeState' }
  /comments/{id}:
    delete:
      tags: [comment]
      summary: 删除评论（作者或管理员）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 已删除 }
  /feed:
    get:
      tags: [feed]
      summary: 已加入频道的动态（latest/hot）
      parameters:
        - name: sort
          in: query
          schema: { type: string, enum: [latest, hot], default: latest }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 动态分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
  /hot:
    get:
      tags: [feed]
      summary: 全站热门讨论（热度 = 浏览 + 点赞×3 + 评论×5，时间衰减）
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 热门帖子分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
  /hot/recommendations:
    get:
      tags: [feed]
      summary: 频道推荐（含推荐理由）
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 推荐频道
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Recommendation' }
  /search:
    get:
      tags: [search]
      summary: 全站搜索（仅公开频道与帖子；每用户 60 次/分钟）
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: type
          in: query
          schema: { type: string, enum: [all, channel, post], default: all }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, latest, members, active] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /search/suggest:
    get:
      tags: [search]
      summary: 搜索联想（已加入频道前缀 + 热词前缀）
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 联想结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSuggest' }
  /search/hot:
    get:
      tags: [search]
      summary: 搜索热词榜
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 热词
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    keyword: { type: string }
                    count: { type: integer }
  /search/history:
    get:
      tags: [search]
      summary: 我的搜索历史
      responses:
        '200':
          description: 历史记录
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    keyword: { type: string }
                    createdAt: { type: string, format: date-time }
    delete:
      tags: [search]
      summary: 清空搜索历史
      responses:
        '204': { description: 已清空 }
  /search/history/{id}:
    delete:
      tags: [search]
      summary: 删除单条搜索历史
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 已删除 }
  /channels/{id}/search:
    get:
      tags: [search]
      summary: 频道内搜索
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 频道内结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
  /channels/{id}/invites:
    get:
      tags: [manage]
      summary: 邀请链接列表
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 邀请列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invite' }
    post:
      tags: [channel]
      summary: 创建邀请链接
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requiresApproval: { type: boolean, default: false }
                expiresInSeconds: { type: integer }
                maxUses: { type: integer }
      responses:
        '201':
          description: 邀请链接（含 token 与分享 URL）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
  /channels/{id}/invites/{inviteId}:
    delete:
      tags: [manage]
      summary: 撤销邀请链接
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: inviteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 已撤销 }
  /invites/{token}/accept:
    post:
      tags: [channel]
      summary: 使用邀请链接加入 / 提交加入申请
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 直接加入或已提交申请
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [JOINED, PENDING] }
                  channel: { $ref: '#/components/schemas/Channel' }
        '404': { $ref: '#/components/responses/NotFound' }
  /channels/{id}/join-requests:
    get:
      tags: [manage]
      summary: 加入申请列表（默认 PENDING）
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING }
      responses:
        '200':
          description: 申请列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JoinRequest' }
  /channels/{id}/join-requests/{requestId}/approve:
    post:
      tags: [manage]
      summary: 通过加入申请
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已通过 }
  /channels/{id}/join-requests/{requestId}/reject:
    post:
      tags: [manage]
      summary: 拒绝加入申请
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已拒绝 }
  /channels/{id}/settings:
    get:
      tags: [manage]
      summary: 频道设置面板（成员/邀请/禁言状态）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 设置信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelSettings' }
  /channels/{id}/mute-all:
    post:
      tags: [manage]
      summary: 全员禁言
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationSeconds: { type: integer, minimum: 60, maximum: 2592000 }
      responses:
        '200': { description: 已设置 }
    delete:
      tags: [manage]
      summary: 解除全员禁言
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 已解除 }
  /channels/{id}/leave:
    post:
      tags: [manage]
      summary: 退出频道（频道主不可退出）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 已退出 }
        '422': { $ref: '#/components/responses/BusinessRule' }
  /channels/{id}/dissolve:
    post:
      tags: [manage]
      summary: 解散频道（仅频道主）
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: 已解散 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /channels/{id}/members:
    get:
      tags: [manage]
      summary: 成员列表（page/size）
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: keyword
          in: query
          schema: { type: string }
        - name: roleId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成员分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
  /channels/{id}/members/{userId}/mute:
    post:
      tags: [manage]
      summary: 禁言成员
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationSeconds]
              properties:
                durationSeconds: { type: integer, minimum: 60, maximum: 2592000 }
      responses:
        '200':
          description: 成员信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
    delete:
      tags: [manage]
      summary: 解除禁言
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 成员信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
  /channels/{id}/members/{userId}:
    delete:
      tags: [manage]
      summary: 移除成员
      parameters:
