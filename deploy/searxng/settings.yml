use_default_settings: true

general:
  instance_name: "isles-search"
  donation_url: false
  contact_url: false

server:
  # 本地开发实例：仅供后端调用，不对外暴露
  secret_key: "isles-local-dev-secret-change-me"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  # 关键：SearXNG 默认只输出 html，必须显式开启 json 才能当 API 用
  formats:
    - html
    - json

# 出站设置：SearXNG 不读 HTTP_PROXY/HTTPS_PROXY 环境变量。
# **代理只挂在需要翻墙的引擎上**（见下方 engines 的 proxies），不要设全局 all://——
# 否则 v2rayN 一关，连 360/yahoo 这些国内引擎也会一起连不上。
outgoing:
  # 单次请求超时（秒），代理链路慢时适当放大
  request_timeout: 8.0
  max_request_timeout: 20.0

ui:
  static_use_hash: true

# 引擎选择：按 2026-11 本机网络实测结果配置
# 需要代理：google / google cse / duckduckgo / brave（不挂代理会 CAPTCHA 或拒绝）
# 直连可用：360search / yahoo（中文/英文兜底，代理挂了也能用）
# 关闭：bing（返回 0 条且无报错，解析器问题）、baidu（CAPTCHA，国内站点无需代理）
engines:
  - name: google
    disabled: false
    proxies:
      all://:
        - socks5h://host.docker.internal:10808
  - name: google cse
    disabled: false
    proxies:
      all://:
        - socks5h://host.docker.internal:10808
  - name: duckduckgo
    disabled: false
    proxies:
      all://:
        - socks5h://host.docker.internal:10808
  - name: brave
    disabled: false
    proxies:
      all://:
        - socks5h://host.docker.internal:10808
  - name: 360search
    disabled: false
  - name: yahoo
    disabled: false
  - name: sogou
    disabled: false
  - name: bing
    disabled: true
  - name: baidu
    disabled: true
