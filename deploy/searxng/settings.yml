use_default_settings: true

general:
  instance_name: "isles-search"
  donation_url: false
  contact_url: false

server:
  # 本地开发实例：仅供后端调用，不对外暴露
  secret_key: "isles-local-dev-secret-change-me"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  # 关键：SearXNG 默认只输出 html，必须显式开启 json 才能当 API 用
  formats:
    - html
    - json

ui:
  static_use_hash: true

# 引擎选择：按 2026-11 本机网络实测结果配置
# 走代理后：google / duckduckgo / brave 可用（质量最高，优先）
# 不走代理时仍可用的：360search / yahoo（中文/英文各一，作为兜底）
# 关闭：bing（返回 0 条且无报错，解析器问题）、baidu（CAPTCHA，且国内站点无需代理）
engines:
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: 360search
    disabled: false
  - name: yahoo
    disabled: false
  - name: sogou
    disabled: false
  - name: bing
    disabled: true
  - name: baidu
    disabled: true
