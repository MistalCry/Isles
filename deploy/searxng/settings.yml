use_default_settings: true

general:
  instance_name: "isles-search"
  donation_url: false
  contact_url: false

server:
  # 本地开发实例：仅供后端调用，不对外暴露
  secret_key: "isles-local-dev-secret-change-me"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  # 关键：SearXNG 默认只输出 html，必须显式开启 json 才能当 API 用
  formats:
    - html
    - json

ui:
  static_use_hash: true

# 引擎选择：按 2026-11 本机网络实测结果配置
# 可用：360search / yahoo（稳定），sogou（间歇崩溃，留作补充）
# 不可用：google（access denied）、baidu（CAPTCHA）、duckduckgo（CAPTCHA）、
#         brave（too many requests）、bing（返回 0 条且无报错，解析器问题）
engines:
  - name: 360search
    disabled: false
  - name: yahoo
    disabled: false
  - name: sogou
    disabled: false
  # 以下引擎在当前网络下全部被拦截，显式关闭以免拖慢每次查询
  - name: google
    disabled: true
  - name: baidu
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: bing
    disabled: true
